# Render Blueprint: the GPU Relay website on Render's free plan (docs/multi-user.md).
# Render > New > Blueprint > this repo. It asks for the values marked `sync: false`; they are
# stored as Render secrets, never in this repo. Users bring their own platform tokens on the
# site's Set up page; the server itself holds none.
services:
  - type: web
    name: gpu-relay
    runtime: docker
    plan: free
    dockerfilePath: ./deploy/server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Where accounts and sealed tokens live: a Postgres URL (Neon or Supabase free plans).
      - key: DATABASE_URL
        sync: false
      # Signs sign-in cookies; stable, so people stay signed in across restarts and sleep.
      - key: GPURELAY_SESSION_KEY
        generateValue: true
      # Seals users' platform tokens. Never change it: stored tokens would become unreadable.
      - key: GPURELAY_VAULT_KEY
        generateValue: true
      # Accounts allowed in all, users' GPU Relay running at once, unfinished jobs per user.
      # The free plan has 512 MB: about two users' GPU Relay at a time.
      - key: GPURELAY_MAX_USERS
        value: "3"
      - key: GPURELAY_MAX_ACTIVE
        value: "2"
      - key: GPURELAY_MAX_JOBS
        value: "3"
      # Optional: sign-up needs this code (share it with the people you invite).
      - key: GPURELAY_INVITE_CODE
        sync: false
      # Optional email (verification, password reset, job emails): an SMTP server.
      - key: GPURELAY_SITE_URL
        value: https://gpu-relay-9uuh.onrender.com
      - key: GPURELAY_SMTP_HOST
        sync: false
      - key: GPURELAY_SMTP_PORT
        value: "587"
      - key: GPURELAY_SMTP_USER
        sync: false
      - key: GPURELAY_SMTP_PASSWORD
        sync: false
      - key: GPURELAY_MAIL_FROM
        sync: false
