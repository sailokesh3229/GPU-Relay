<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Relay</title>
<style>
:root{
  --bg:#F3F4F6;--card:#FFFFFF;--line:#E2E5EA;--line-soft:#EEF0F3;--field:#CDD2DA;
  --ink:#15171C;--ink2:#3D4350;--muted:#5B6270;
  --accent:#2952CC;--accent-dark:#1D3C99;--accent-soft:#EBF0FD;--accent-ink:#FFFFFF;
  --warn-bg:#FFF4E0;--warn-line:#F2D49B;--warn-ink:#6B3F00;--warn:#C98A1E;
  --good-bg:#E6F4EC;--good-ink:#14552F;--good:#1E7A46;
  --bad-bg:#FDECEA;--bad-ink:#8A1C12;--bad:#B42318;
  --grey-bg:#EEF0F3;--grey:#9AA1AC;
  --colab:#E8710A;--mono:ui-monospace,"Cascadia Mono",Consolas,"JetBrains Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111318;--card:#1A1D24;--line:#2A2F39;--line-soft:#232832;--field:#3A404C;
  --ink:#ECEEF2;--ink2:#C9CED8;--muted:#A3AAB8;
  --accent:#6E8EF0;--accent-dark:#A9BCF7;--accent-soft:#1F2A4A;--accent-ink:#0B1020;
  --warn-bg:#2E2412;--warn-line:#5C4618;--warn-ink:#F2C979;--warn:#E0A63A;
  --good-bg:#12291D;--good-ink:#8FD9AE;--good:#3FB673;
  --bad-bg:#2F1513;--bad-ink:#F5A59C;--bad:#F97066;
  --grey-bg:#242933;--grey:#6B7280;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}a:hover{color:var(--accent-dark)}
button,input,select,textarea{font:inherit;color:inherit}
.app{min-height:100vh;display:flex;flex-wrap:wrap}
nav.side{flex:1 1 220px;max-width:248px;padding:20px 14px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.links{display:flex;flex-direction:column;gap:2px}
.links a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:8px;color:var(--ink2);font-weight:500;text-decoration:none}
.links a:hover{background:var(--line-soft)}
.links a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-dark);font-weight:600}
.links .count{margin-left:auto;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--line-soft);color:var(--muted)}
.ctl{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.ctl strong{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grey);flex:none}
.dot.on{background:var(--good)}.dot.off{background:var(--bad)}
main{flex:999 1 560px;min-width:0;padding:28px 32px;display:flex;flex-direction:column;gap:22px}
@media (max-width:720px){nav.side{max-width:none;flex-basis:100%;border-right:none;border-bottom:1px solid var(--line)}main{padding:20px 16px}.ctl{margin-top:0}}
header.page{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
header.page>div{margin-right:auto;min-width:0}
h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
h2{margin:0;font-size:16px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.mono{font-family:var(--mono);font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--field);background:var(--card);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-dark);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{min-height:32px;padding:0 12px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.banner>div{flex:1 1 280px;display:flex;flex-direction:column;gap:2px}
.banner strong{color:var(--ink)}
.banner.info{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-dark)}
.banner.bad{background:var(--bad-bg);border-color:var(--bad-bg);color:var(--bad-ink)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--field);background:var(--card);color:var(--ink2);font-weight:500;font-size:13px;cursor:pointer}
.tabs button[aria-selected="true"],.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:minmax(150px,2.2fr) minmax(120px,1.5fr) minmax(90px,1.1fr) minmax(120px,1.6fr) minmax(70px,.8fr) minmax(70px,.8fr);gap:12px;align-items:center;min-width:680px}
.grid.head{padding:10px 18px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line)}
a.row{padding:14px 18px;border-bottom:1px solid var(--line-soft);color:var(--ink);text-decoration:none}
a.row:last-child{border-bottom:none}
a.row:hover{background:var(--line-soft);color:var(--ink)}
.name{display:flex;flex-direction:column;min-width:0}
.name b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.chip .dot{width:7px;height:7px}
.c-running{background:var(--accent-soft);color:var(--accent-dark)}.c-running .dot{background:var(--accent)}
.c-needs{background:var(--warn-bg);color:var(--warn-ink)}.c-needs .dot{background:var(--warn)}
.c-quota,.c-paused{background:var(--grey-bg);color:var(--ink2)}.c-quota .dot,.c-paused .dot{background:var(--grey)}
.c-queued{background:var(--bg);color:var(--ink2)}.c-queued .dot{background:var(--grey)}
.c-done{background:var(--good-bg);color:var(--good-ink)}.c-done .dot{background:var(--good)}
.c-failed{background:var(--bad-bg);color:var(--bad-ink)}.c-failed .dot{background:var(--bad)}
.prog{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;min-width:40px}
.bar>span{display:block;height:100%;background:var(--accent)}
.bar.done>span{background:var(--good)}.bar.failed>span{background:var(--bad)}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
a.bcard{display:flex;flex-direction:column;gap:10px;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none}
a.bcard:hover{border-color:var(--field);color:var(--ink)}
.bcard .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);gap:8px}
.big{font-size:22px;font-weight:700;letter-spacing:-.02em}
.big span{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:24px;font-weight:700;letter-spacing:-.02em}.stat .s{font-size:12px;color:var(--muted)}
.timeline{display:flex;height:28px;border-radius:6px;overflow:hidden;background:var(--line-soft);gap:2px}
.timeline span{display:block;height:100%;min-width:3px}
.seg-kaggle{background:var(--accent)}.seg-colab{background:var(--colab)}.seg-other{background:var(--good)}.seg-gap{background:transparent}
.seg-running{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
pre.log{margin:0;max-height:440px;overflow:auto;padding:14px;border-radius:8px;background:#0F1218;color:#D7DCE5;font:12.5px/1.55 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
ul.files{list-style:none;margin:0;padding:0}
ul.files li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:18px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:1fr}}
form.opts{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-weight:600;font-size:13px}
.field input[type=text],.field input[type=number],.field select,.field textarea{min-height:40px;padding:0 12px;border:1px solid var(--field);border-radius:8px;background:var(--card)}
.field textarea{padding:8px 12px;min-height:64px;resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 20px;border:2px dashed var(--field);border-radius:12px;text-align:center;background:var(--card)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.lvl{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600}
.lvl-FULL{background:var(--good-bg);color:var(--good-ink)}.lvl-PARTIAL{background:var(--warn-bg);color:var(--warn-ink)}.lvl-RESTART_ONLY{background:var(--bad-bg);color:var(--bad-ink)}
.chart{display:flex;align-items:flex-end;gap:10px;height:140px;padding:0 4px;border-bottom:1px solid var(--field)}
.chart span{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart span.today{opacity:.7}
.days{display:flex;gap:10px;padding:0 4px;font-size:12px;color:var(--muted)}.days span{flex:1;text-align:center}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:8px 18px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.ok{color:var(--good)}.no{color:var(--bad)}
.msg{font-size:13px;min-height:1.4em}
.msg.err{color:var(--bad)}.msg.good{color:var(--good)}
#act-msg:empty{display:none}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:500;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Main">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect x="1" y="1" width="26" height="26" rx="7" fill="#2952CC"></rect><path d="M7 17h5l3-6 3 6h3" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      GPU Relay
    </div>
    <div class="links">
      <a href="#/" data-route="jobs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 14h8"></path></svg>Jobs<span class="count" id="nav-count">0</span></a>
      <a href="#/submit" data-route="submit"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Submit job</a>
      <a href="#/budget" data-route="budget"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>GPU budget</a>
      <a href="#/settings" data-route="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"></path></svg>Settings</a>
    </div>
    <div class="ctl" aria-live="polite">
      <strong><span class="dot" id="ctl-dot"></span><span id="ctl-text">Connecting…</span></strong>
      <span id="ctl-sub"></span>
      <span id="who"></span>
      <form id="logout" method="post" action="logout" hidden><button class="btn small" type="submit">Log out</button></form>
      <a id="owner-login" class="btn small" href="login" hidden>Owner log in</a>
    </div>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<script>
"use strict";
const ACT = {"X-GPURelay-Action": "1"};
let overview = null, me = {role: "owner", login: false}, timer = null, filter = "all", outTab = "log";
let submitState = null;

// ---------------------------------------------------------------- helpers (text only, no HTML parsing)
function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key === "class") node.className = value;
    else if (key === "text") node.textContent = value;
    else if (key === "style") node.style.cssText = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const view = () => document.getElementById("view");
function hours(h) {
  if (h === null || h === undefined) return "–";
  if (h < 1 / 60) return "0 h";
  if (h < 1) return `${Math.round(h * 60)} m`;
  return `${h < 100 ? h.toFixed(1).replace(/\.0$/, "") : Math.round(h)} h`;
}
function span(s) {
  s = Math.max(0, s);
  if (s < 90) return `${Math.round(s)} s`;
  if (s < 5400) return `${Math.round(s / 60)} m`;
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h >= 48 ? `${Math.round(h / 24)} days` : `${h} h ${m} m`;
}
function ago(iso) { return iso ? `${span((Date.now() - Date.parse(iso)) / 1000)} ago` : "–"; }
function when(iso) {
  if (!iso) return "–";
  return new Date(iso).toLocaleString(undefined, {weekday: "short", hour: "2-digit", minute: "2-digit", month: "short", day: "numeric"});
}
function backendLabel(name, gpu) {
  if (!name) return "–";
  const nice = {kaggle: "Kaggle", colab_manual: "Colab", colab: "Colab", local: "This computer", lightning: "Lightning AI"}[name] || name;
  return gpu ? `${nice} ${gpu.replace("NvidiaTesla", "").replace("Tesla ", "")}` : nice;
}
async function api(url, options) {
  const response = await fetch(url, Object.assign({cache: "no-store", credentials: "same-origin"}, options || {}));
  if (response.status === 401) { location.href = "login"; throw new Error("log in first"); }
  let body = null;
  try { body = await response.json(); } catch (e) { body = null; }
  if (!response.ok) throw new Error((body && body.detail) || `${response.status} ${response.statusText}`);
  return body;
}
const post = (url, data) => api(url, {method: "POST", headers: Object.assign({"Content-Type": "application/json"}, ACT), body: data === undefined ? undefined : JSON.stringify(data)});
const owner = () => me.role === "owner";
function viewOnlyNote() {
  return owner() ? null : el("div", {class: "banner info", role: "note"}, el("div", {}, el("strong", {text: "View-only access"}),
    el("span", {text: "You can look at everything. Only the owner can submit, pause or cancel jobs."})),
    me.anonymous ? el("a", {class: "btn small", href: "login"}, "Owner log in") : null);
}

// ---------------------------------------------------------------- job states
const STATES = {
  queued: ["Queued", "queued"], launching: ["Starting", "running"], running: ["Running", "running"],
  handoff: ["Handing off", "running"], assembling: ["Collecting outputs", "running"],
  completed: ["Completed", "done"], awaiting_user: ["Needs you", "needs"],
  waiting_for_quota: ["Waiting for quota", "quota"], paused: ["Paused", "paused"],
  failed_user: ["Failed: your code", "failed"], failed_infra: ["Failed: platform", "failed"],
  cancelled: ["Cancelled", "paused"],
};
function chip(state, label) {
  const [text, kind] = STATES[state] || [state, "queued"];
  return el("span", {class: `chip c-${kind}`}, el("span", {class: "dot"}), label || text);
}
function pct(job) {
  if (job.state === "completed") return 100;
  if (job.total) return Math.min(100, Math.round((100 * job.completed) / job.total));
  return null;
}
function group(job) {
  if (job.state === "awaiting_user") return "needs";
  return job.terminal ? "done" : "active";
}
function progressBar(job) {
  const p = pct(job);
  const kind = job.state === "completed" ? "done" : job.state.startsWith("failed") ? "failed" : "";
  return el("span", {class: "prog"},
    el("span", {class: `bar ${kind}`}, el("span", {style: `width:${p === null ? 0 : p}%`})),
    el("span", {class: "small muted", text: p === null ? (job.progress || "–") : `${p}%`}));
}

// ---------------------------------------------------------------- shell
async function refreshShell() {
  overview = await api("api/overview");
  const active = overview.jobs.filter((j) => !j.terminal).length;
  document.getElementById("nav-count").textContent = String(active);
  const on = overview.controller_running;
  document.getElementById("ctl-dot").className = `dot ${on ? "on" : "off"}`;
  document.getElementById("ctl-text").textContent = on ? "Controller running" : "Controller stopped";
  const running = overview.backends.reduce((n, b) => n + b.running, 0);
  document.getElementById("ctl-sub").textContent = on
    ? `${running} GPU session${running === 1 ? "" : "s"} running · updated ${new Date(overview.now).toLocaleTimeString()}`
    : "Jobs wait until it starts again.";
}
function setNav(route) {
  for (const a of document.querySelectorAll(".links a")) {
    if (a.dataset.route === route) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  }
}
function render(...nodes) { view().replaceChildren(...nodes.flat().filter(Boolean)); }
function errorBox(err) {
  return el("div", {class: "banner bad", role: "alert"}, el("div", {}, el("strong", {text: "Could not load this page"}), el("span", {text: String(err.message || err)})));
}

// ---------------------------------------------------------------- Jobs
function jobsView() {
  const jobs = overview.jobs;
  const counts = {all: jobs.length, active: 0, needs: 0, done: 0};
  for (const j of jobs) { const g = group(j); counts[g] += 1; if (g === "needs") counts.active += 1; }
  const quota = jobs.filter((j) => j.state === "waiting_for_quota").length;
  const summary = jobs.length
    ? `${counts.active} active, ${counts.needs} need${counts.needs === 1 ? "s" : ""} you, ${quota} waiting for quota`
    : "No jobs yet";
  const banners = overview.colab_actions.map((a) => el("section", {class: "banner", "aria-label": "Needs your action"},
    el("div", {}, el("strong", {text: `${a.name} is waiting for you on Colab`}),
      el("span", {text: "Save the resume notebook, open colab.research.google.com, choose File > Upload notebook, then Runtime > Run all. It continues from the last checkpoint."})),
    el("a", {class: "btn", href: `api/jobs/${encodeURIComponent(a.job_id)}/colab-notebook`, download: ""}, "Save notebook")));
  const tabs = el("div", {class: "tabs", role: "tablist", "aria-label": "Filter jobs"},
    [["all", "All"], ["active", "Active"], ["needs", "Needs you"], ["done", "Finished"]].map(([id, label]) =>
      el("button", {type: "button", role: "tab", "aria-selected": String(filter === id),
        onclick: () => { filter = id; show(); }}, `${label} ${counts[id]}`)));
  const shown = jobs.filter((j) => filter === "all" || group(j) === filter || (filter === "active" && group(j) === "needs"));
  const rows = shown.map((j) => el("a", {class: "grid row", href: `#/job/${encodeURIComponent(j.id)}`},
    el("span", {class: "name"}, el("b", {text: j.name}),
      el("span", {text: j.message && j.terminal && j.state !== "completed" ? j.message : `${j.entry} · ${j.segments} segment${j.segments === 1 ? "" : "s"}`})),
    el("span", {}, chip(j.state)),
    el("span", {text: backendLabel(j.backend)}),
    progressBar(j),
    el("span", {text: hours(j.used_h)}),

      el("dt", {text: "Where"}), el("dd", {text: s.storage.kind === "hf_hub" ? `Hugging Face private repo ${s.storage.repo}` : s.storage.kind}),
      el("dt", {text: "Access token"}), el("dd", {}, yes(s.storage.token, "found", "missing")),
      el("dt", {text: "Holds"}), el("dd", {text: "jobs, checkpoints, logs, outputs, and the server's job list backup"}))),
    el("section", {class: "card"}, el("h2", {text: "GPU platforms"}), el("div", {class: "scroll"}, el("table", {},
      el("thead", {}, el("tr", {}, ["Platform", "State", "Details", "Credentials"].map((t) => el("th", {scope: "col", text: t})))),
      el("tbody", {}, rows)))),
    el("section", {class: "card"}, el("h2", {text: "Access"}), el("dl", {class: "kv"},
      el("dt", {text: "You are"}), el("dd", {text: me.anonymous ? "a guest (read-only)" : me.login ? (owner() ? "the owner" : "a viewer (read-only)") : "on this computer"}),
      el("dt", {text: "Login"}), el("dd", {text: !s.server ? "none (local only)" : s.public_view
        ? "anyone can look; the owner logs in to make changes (5 wrong tries lock a visitor out for 15 minutes)"
        : "required; 5 wrong tries lock a visitor out for 15 minutes"}),
      el("dt", {text: "View-only password"}), el("dd", {text: s.viewer_access ? "on" : "off"}),
      el("dt", {text: "Work at risk"}), el("dd", {text: `at most ${span(s.runtime.max_lost_work_s)} of GPU work per interruption`}),
      el("dt", {text: "Version"}), el("dd", {class: "mono", text: s.version}))));
}

// ---------------------------------------------------------------- router
function route() {
  const hash = location.hash.replace(/^#\/?/, "");
  if (hash.startsWith("job/")) return {name: "job", id: decodeURIComponent(hash.slice(4))};
  return {name: ["submit", "budget", "settings"].includes(hash) ? hash : "jobs"};
}
async function show() {
  const r = route();
  setNav(r.name === "job" ? "jobs" : r.name);
  try {
    if (!overview) await refreshShell();
    if (r.name === "jobs") jobsView();
    else if (r.name === "job") await jobView(r.id);
    else if (r.name === "submit") submitView();
    else if (r.name === "budget") budgetView();
    else await settingsView();
  } catch (e) { render(errorBox(e)); }
}
async function tick() {
  try { await refreshShell(); } catch (e) { return; }
  const r = route();
  const typing = document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (typing || r.name === "submit" || r.name === "settings") return;  // never wipe what the user is doing
  if (r.name === "job") {
    if (outTab !== "log") return;
    const log = document.querySelector("pre.log");  // reading older output: leave it in place
    if (log && log.scrollTop + log.clientHeight < log.scrollHeight - 20) return;
  }
  await show();
}
window.addEventListener("hashchange", () => { if (route().name !== "job") outTab = "log"; show(); view().focus({preventScroll: true}); });
(async () => {
  try {
    me = await api("api/me");
    if (me.anonymous) {
      document.getElementById("owner-login").hidden = false;
      document.getElementById("who").textContent = "Viewing as a guest (read-only)";
    } else if (me.login) {
      document.getElementById("logout").hidden = false;
      document.getElementById("who").textContent = owner() ? "Logged in as owner" : "Logged in as viewer (read-only)";
    }
  } catch (e) { /* the page shows the error below */ }
  await show();
  timer = setInterval(tick, 10000);
})();
</script>
