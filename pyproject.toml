[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gpurelay"
dynamic = ["version"]
description = "Run ML workloads to completion on free GPU tiers by checkpointing and relaying jobs across platforms."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core dependencies only. ML frameworks are optional and imported lazily (spec §16).
# Dependencies needed by later phases (huggingface_hub, nbformat/IPython, keyring, ...)
# are added in the phase that first uses them.
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6,<3",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "cloudpickle>=3.0",
    "zstandard>=0.22",
    "ipython>=8.10",
    "nbformat>=5.9",
    "huggingface_hub>=0.24",
    "keyring>=24",
    "psutil>=5.9",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "numpy>=1.24"]
tf = ["tensorflow>=2.13"]
hf = ["transformers>=4.38", "accelerate>=0.27"]
lightning = ["lightning>=2.1"]
kaggle = ["kaggle>=2.0"]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29"]
# The desktop app: native window, tray icon, notifications (plus the dashboard).
desktop = [
    "fastapi>=0.110", "uvicorn>=0.29", "kaggle>=2.0",
    "pywebview>=5", "pystray>=0.19", "pillow>=10",
]
# Lightning AI backend (the official SDK; PyTorch Lightning is the "lightning" extra).
lightning-ai = ["lightning-sdk>=2026.7"]
# Modal backend (the official SDK).
modal = ["modal>=1.0"]
# The multi-user website: accounts in Postgres, sealed tokens, forwarding to users.
server = ["psycopg[binary]>=3.1", "cryptography>=42", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]
# The user's paid GPU platforms (spec §21): RunPod, Vast.ai, Lambda and DigitalOcean need
# nothing extra (their REST APIs); the hyperscalers use their official SDKs.
aws = ["boto3>=1.34"]
gcp = ["google-auth>=2.20", "requests>=2.31"]
azure = ["azure-identity>=1.15", "azure-mgmt-compute>=30", "azure-mgmt-network>=25",
         "azure-mgmt-resource>=23", "cryptography>=42"]
clouds = ["gpurelay[aws,gcp,azure]"]
gdrive = ["google-api-python-client>=2.100", "google-auth>=2.20", "google-auth-oauthlib>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "cryptography>=42",  # the website's token vault (tests of the gateway)
    "numpy>=1.24",  # tests of NumPy random-state restore
]

[project.scripts]
gpurelay = "gpurelay.cli:app"

[project.gui-scripts]
gpurelay-desktop = "gpurelay.desktop.app:main"

[tool.hatch.version]
path = "src/gpurelay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gpurelay"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["spec.md", "plan.md", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["gpurelay"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.10"
files = ["src/gpurelay"]
mypy_path = "src"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Optional / untyped third-party libraries.
module = [
    "tomli.*",
    "cloudpickle.*",
    "zstandard.*",
    "torch.*",
    "numpy.*",
    "tensorflow.*",
    "keras.*",
    "transformers.*",
    "lightning.*",
    "pytorch_lightning.*",
    "kaggle.*",
    "huggingface_hub.*",
    "IPython.*",
    "nbformat.*",
    "keyring.*",
    "plyer.*",
    "pystray.*",
    "modal.*",
    "webview.*",
    "PIL.*",
    "psycopg.*",
    "boto3.*",
    "azure.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Partially typed: treat as untyped (Any) instead of checking their internals.
module = ["IPython.*", "nbformat.*", "traitlets.*", "psutil.*", "lightning_sdk.*", "googleapiclient.*", "google.*", "google_auth_oauthlib.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"
timeout = 120
markers = [
    "torch: requires PyTorch (skipped when not installed)",
    "tf: requires TensorFlow (skipped when not installed)",
    "hf: requires transformers (skipped when not installed)",
    "lightning: requires PyTorch Lightning (skipped when not installed)",
    "keras: requires Keras 3 (skipped when not installed)",
    "integration: slower end-to-end tests",
]
